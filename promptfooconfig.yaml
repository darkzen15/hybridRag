description: "Hybrid RAG Evaluation Suite"

# Point Promptfoo to your FastAPI middleware
providers:
  - id: "openai:chat:hybrid-rag-llama3.2"
    config:
      apiBaseUrl: "http://hybrid-rag-api:8000/v1"
      apiKey: "not-needed"

prompts:
  - "{{user_query}}"

tests:
  - description: "Check direct knowledge retrieval"
    vars:
      user_query: "What databases are used in this hybrid RAG architecture?"
    assert:
      - type: contains
        value: "Qdrant"
      - type: contains
        value: "Neo4j"

  - description: "Factuality check using LLM-as-a-judge"
    vars:
      user_query: "How are vector embeddings stored and searched?"
    assert:
      - type: llm-rubric
        value: "Explains that vector embeddings are generated by nomic-embed-text and stored in Qdrant."

  - description: "Negative test / Guardrail check"
    vars:
      user_query: "What is the capital of Mars?"
    assert:
      - type: contains
        value: "cannot answer"