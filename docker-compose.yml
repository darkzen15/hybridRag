version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Ollama - Local LLMs and Embeddings
  # ---------------------------------------------------------------------------
  ollama-rag:
    image: ollama/ollama:latest
    container_name: ollama-rag
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_CONTEXT_LENGTH=8192
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment lines below to enable NVIDIA GPU acceleration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Qdrant - Vector Database
  # ---------------------------------------------------------------------------
  qdrant-rag:
    image: qdrant/qdrant:latest
    container_name: qdrant-rag
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. Neo4j - Knowledge Graph Database
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20.0-community
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Open WebUI - User Chat Interface
  # ---------------------------------------------------------------------------
  open-webui-rag:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-rag
    ports:
      - "3000:8080"
    environment:
      # Route OpenAI completions directly to FastAPI middleware gateway
      - OPENAI_API_BASE_URL=http://hybrid-rag-api:8000/v1
      - OPENAI_API_KEY=not_needed
      - OLLAMA_BASE_URL=http://ollama-rag:11434
      - WEBUI_SECRET_KEY=secret_key_change_in_production
      # Disable Open WebUI internal RAG & web search engines
      - ENABLE_RAG_HYBRID_SEARCH=False
      - ENABLE_RAG_WEB_SEARCH=False
      # Disable file attachment uploads inside Open WebUI chat
      - RAG_FILE_MAX_COUNT=0
      - RAG_FILE_MAX_SIZE=0
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - hybrid-rag-api
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 5. Hybrid RAG FastAPI Middleware Gateway
  # ---------------------------------------------------------------------------
  hybrid-rag-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hybrid-rag-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama-rag:11434
      - QDRANT_HOST=qdrant-rag
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - ollama-rag
      - qdrant-rag
      - neo4j
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 6. Streamlit Ingestion GUI
  # ---------------------------------------------------------------------------
  ingest-gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    container_name: ingest-gui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://hybrid-rag-api:8000/ingest
    depends_on:
      - hybrid-rag-api
    restart: unless-stopped

# ---------------------------------------------------------------------------
  # 7. Promptfoo - RAG Evaluation & Benchmarking
  # ---------------------------------------------------------------------------
  promptfoo:
    image: ghcr.io/promptfoo/promptfoo:latest
    container_name: promptfoo
    ports:
      - "15000:3000"
    volumes:
      - ./promptfoo_data:/home/promptfoo/.promptfoo
      - ./:/data
    environment:
      - PROMPTFOO_DISABLE_TELEMETRY=true
    depends_on:
      - hybrid-rag-api

volumes:
  ollama_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  open_webui_data:

networks:
  default:
    name: hybrid-rag-network